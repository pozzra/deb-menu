name: Build iOS deb

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          cp -R "$RUNNER_TEMP/theos-sdks"/*.sdk "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build rootful package
        run: |
          set -o pipefail
          chmod +x layout/usr/bin/rxa-menu
          make clean package FINALPACKAGE=1 2>&1 | tee build.log
          mkdir -p out/rootful
          mv packages/*.deb out/rootful/
          src="$(find out/rootful -maxdepth 1 -name '*.deb' | head -n 1)"
          cp "$src" out/rootful/Rxaa.deb
          test -s out/rootful/Rxaa.deb

      - name: Build rootless package
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x layout/usr/bin/rxa-menu
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee -a build.log
          mkdir -p out/rootless
          mv packages/*.deb out/rootless/
          src="$(find out/rootless -maxdepth 1 -name '*.deb' | head -n 1)"
          cp "$src" out/rootless/Rxaa-rootless.deb
          test -s out/rootless/Rxaa-rootless.deb

      - name: Upload rootful Rxaa.deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rxaa-deb
          path: out/rootful/Rxaa.deb
          if-no-files-found: warn

      - name: Upload rootless Rxaa-rootless.deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rxaa-rootless-deb
          path: out/rootless/Rxaa-rootless.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -n -E "error:|fatal error:|undefined reference|No such file|Error [0-9]" build.log | head -n 20 | while IFS= read -r line; do
              echo "::error title=Build error::$line"
            done
          fi
